# Checks every day whether Prism Launcher has a new release and tries the patches on it.
#   - patches apply and the Windows build + tests pass -> a pull request to dev with the updated patches
#     (merging dev into main later builds the new version and publishes it as a GitHub Release)
#   - patches don't apply, or the build fails          -> an issue explaining what failed
# It can also be started by hand from the Actions tab ("Run workflow").
name: Follow Prism Launcher releases

on:
  schedule:
    - cron: "17 21 * * *" # every day at 06:17 JST
  workflow_dispatch:
    inputs:
      tag:
        description: "Prism Launcher tag to try (empty: the latest release)"
        required: false
        default: ""
      force:
        description: "Try even if this version is current or was already handled"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: follow-prism
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      WORK_DIR: ${{ github.workspace }}/.work
    outputs:
      result: ${{ steps.check.outputs.result }}
      tag: ${{ steps.check.outputs.tag }}
      current: ${{ steps.check.outputs.current }}
    steps:
      # The new patches go to dev; main only gets them when dev is merged for a release.
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Try the patches on the new release
        id: check
        env:
          TARGET_TAG: ${{ inputs.tag }}
          FORCE: ${{ inputs.force }}
        run: bash scripts/check-prism-update.sh

      - name: Push the updated patches to a branch
        if: steps.check.outputs.result == 'applied'
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: bash scripts/report.sh branch

      - name: Open an issue (the patches don't apply)
        if: steps.check.outputs.result == 'apply-failed'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          CURRENT: ${{ steps.check.outputs.current }}
          REASON: apply-failed
        run: bash scripts/report.sh issue

  build:
    needs: check
    if: needs.check.outputs.result == 'applied'
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: prism-${{ needs.check.outputs.tag }}
      release: false

  report:
    needs: [check, build]
    if: always() && needs.check.outputs.result == 'applied'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.check.outputs.tag }}
      CURRENT: ${{ needs.check.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - name: Open a pull request
        if: needs.build.result == 'success'
        run: bash scripts/report.sh pr

      - name: Open an issue (the build failed)
        if: needs.build.result != 'success'
        env:
          REASON: build-failed
        run: bash scripts/report.sh issue
